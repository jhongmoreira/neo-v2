<!doctype html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nova senha · IADocs</title>
  <link rel="icon" type="image/png" href="assets/img/favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/app.css">

  <!-- INTEGRAÇÃO: <style>:root{--brand:{{ primary_color }};--brand-secondary:{{ secondary_color }}}</style> -->
</head>

<body class="h-full">
  <div class="grid min-h-full lg:grid-cols-2">

    <!-- Painel da marca (a partir de lg) -->
    <aside class="relative hidden overflow-hidden bg-primary text-white lg:flex lg:flex-col lg:justify-between lg:p-12">
      <div aria-hidden="true"
        class="absolute inset-0 bg-[radial-gradient(circle_at_85%_15%,color-mix(in_oklab,var(--accent)_75%,transparent),transparent_55%),radial-gradient(circle_at_10%_95%,color-mix(in_oklab,var(--accent)_35%,transparent),transparent_50%)]"></div>

      <!-- INTEGRAÇÃO: logo expandida do tenant -->
      <img src="assets/img/logo-white.png" alt="IADocs" class="relative h-16 w-auto self-start">

      <div class="relative flex max-w-md flex-col gap-3">
        <p class="font-heading text-3xl leading-tight font-semibold text-balance">
          Quase lá.
        </p>
        <p class="text-sm text-white/80">
          Depois de criar sua senha, você já pode entrar e começar a escrever.
        </p>
      </div>
    </aside>

    <main class="flex flex-col items-center justify-center px-6 py-12">
      <div class="w-full max-w-sm">
        <img src="assets/img/logo-white.png" alt="IADocs" class="mx-auto mb-10 h-20 w-auto brightness-0 lg:hidden">
        <h1 class="font-heading text-2xl font-semibold tracking-tight">Crie sua nova senha</h1>
        <p class="mt-1.5 text-sm text-slate-500">Escolha uma senha que você não use em outros sites.</p>

        <!-- INTEGRAÇÃO: action="{{ route('password.reset.post') }}" + @csrf
             <input type="hidden" name="token" value="{{ $token }}"> · e-mail vem de $email · remover data-demo -->
        <form class="mt-8 space-y-4" action="#" method="POST" novalidate data-auth-form="reset" data-success-url="login.html" data-success-message="Senha criada! Agora é só entrar." data-demo>
          <div>
            <label for="email" class="form-label">E-mail</label>
            <input id="email" name="email" type="email" class="form-input" autocomplete="email" value="maria.souza@escola.com.br" required>
          </div>
          <div>
            <label for="password" class="form-label">Nova senha</label>
            <div class="relative">
              <input id="password" name="password" type="password" class="form-input pr-12" autocomplete="new-password" required data-password-rules="rules-password" autofocus>
              <button type="button" data-password-toggle="password" aria-label="Mostrar senha"
                class="absolute inset-y-0 right-0 flex w-11 items-center justify-center text-slate-400 hover:text-slate-700">
                <span data-icon="show" class="icon-[lucide--eye] size-4" aria-hidden="true"></span>
                <span data-icon="hide" class="icon-[lucide--eye-off] hidden size-4" aria-hidden="true"></span>
              </button>
            </div>
            <ul id="rules-password" class="mt-3 grid gap-1.5 text-xs text-slate-500" aria-label="Requisitos da senha">
              <li data-rule="length" data-valid="false" class="group flex items-center gap-2 transition data-[valid=true]:text-success">
                <span class="icon-[lucide--circle] size-3.5 group-data-[valid=true]:hidden" aria-hidden="true"></span>
                <span class="icon-[lucide--circle-check] hidden size-3.5 group-data-[valid=true]:inline-block" aria-hidden="true"></span>Pelo menos 6 caracteres
              </li>
              <li data-rule="letter" data-valid="false" class="group flex items-center gap-2 transition data-[valid=true]:text-success">
                <span class="icon-[lucide--circle] size-3.5 group-data-[valid=true]:hidden" aria-hidden="true"></span>
                <span class="icon-[lucide--circle-check] hidden size-3.5 group-data-[valid=true]:inline-block" aria-hidden="true"></span>Pelo menos uma letra
              </li>
              <li data-rule="number" data-valid="false" class="group flex items-center gap-2 transition data-[valid=true]:text-success">
                <span class="icon-[lucide--circle] size-3.5 group-data-[valid=true]:hidden" aria-hidden="true"></span>
                <span class="icon-[lucide--circle-check] hidden size-3.5 group-data-[valid=true]:inline-block" aria-hidden="true"></span>Pelo menos um número
              </li>
            </ul>
          </div>
          <div>
            <label for="password_confirmation" class="form-label">Confirmar nova senha</label>
            <div class="relative">
              <input id="password_confirmation" name="password_confirmation" type="password" class="form-input pr-12" autocomplete="new-password" required data-password-confirm="password">
              <button type="button" data-password-toggle="password_confirmation" aria-label="Mostrar senha"
                class="absolute inset-y-0 right-0 flex w-11 items-center justify-center text-slate-400 hover:text-slate-700">
                <span data-icon="show" class="icon-[lucide--eye] size-4" aria-hidden="true"></span>
                <span data-icon="hide" class="icon-[lucide--eye-off] hidden size-4" aria-hidden="true"></span>
              </button>
            </div>
            <p data-confirm-message class="mt-1.5 hidden text-xs text-danger">As senhas não coincidem.</p>
          </div>
          <p role="alert" data-form-error class="hidden text-sm text-danger"></p>
          <button type="submit" class="btn-primary mt-2 w-full" data-submit>Salvar nova senha</button>
        </form>

        <p class="mt-10 text-center text-sm text-slate-500">
          <a href="login.html" class="link inline-flex items-center gap-1.5"><span class="icon-[lucide--arrow-left] size-4" aria-hidden="true"></span>Voltar para o login</a>
        </p>
      </div>
    </main>
  </div>

  <script src="assets/js/app.js" defer></script>
  <script src="assets/js/auth.js" defer></script>
</body>
</html>
