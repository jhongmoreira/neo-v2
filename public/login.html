<!doctype html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · IADocs</title>
  <link rel="icon" type="image/png" href="assets/img/favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/app.css">

  <!-- INTEGRAÇÃO: <style>:root{--brand:{{ primary_color }};--brand-secondary:{{ secondary_color }}}</style> -->
</head>

<body class="h-full">
  <div class="grid min-h-full lg:grid-cols-2">

    <!-- Painel da marca (a partir de lg) -->
    <aside class="relative hidden overflow-hidden bg-primary text-white lg:flex lg:flex-col lg:justify-between lg:p-12">
      <div aria-hidden="true"
        class="absolute inset-0 bg-[radial-gradient(circle_at_85%_15%,color-mix(in_oklab,var(--accent)_75%,transparent),transparent_55%),radial-gradient(circle_at_10%_95%,color-mix(in_oklab,var(--accent)_35%,transparent),transparent_50%)]"></div>

      <!-- INTEGRAÇÃO: logo expandida do tenant -->
      <img src="assets/img/logo-white.png" alt="IADocs" class="relative h-16 w-auto self-start">

      <div class="relative flex max-w-md flex-col gap-3">
        <p class="font-heading text-3xl leading-tight font-semibold text-balance">
          Escreva, revise e evolua a cada redação.
        </p>
        <p class="text-sm text-white/80">
          Dicas da inteligência artificial enquanto você escreve, e correção completa quando você entrega.
        </p>
      </div>
    </aside>

    <!-- Formulário -->
    <main class="flex flex-col items-center justify-center px-6 py-12">
      <div class="w-full max-w-sm">

        <!-- Logo no mobile (no desktop ela está no painel) -->
        <img src="assets/img/logo-white.png" alt="IADocs" class="mx-auto mb-10 h-20 w-auto brightness-0 lg:hidden">

        <h1 class="font-heading text-2xl font-semibold tracking-tight">Entrar</h1>
        <!-- INTEGRAÇÃO: $institution->getNamings()->platform_name -->
        <p class="mt-1.5 text-sm text-slate-500">Acesse sua conta na IADocs.</p>

        <!-- INTEGRAÇÃO: session('status') / @error('username') / @error('password') -->
        <p id="login-alert" role="alert" aria-live="polite" class="mt-6 hidden text-sm"></p>

        <!-- INTEGRAÇÃO: action="{{ route('login') }}" + @csrf. Remover data-demo. -->
        <form id="login-form" class="mt-8 space-y-4" action="#" method="POST" novalidate data-demo>
          <div>
            <label for="username" class="form-label">Usuário</label>
            <input id="username" name="username" type="text" class="form-input"
              autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
          </div>

          <div>
            <div class="flex items-baseline justify-between">
              <label for="password" class="form-label">Senha</label>
              <!-- INTEGRAÇÃO: route('forgot-password') -->
              <a href="forgot-password.html" class="link text-xs">Esqueceu?</a>
            </div>
            <div class="relative">
              <input id="password" name="password" type="password" class="form-input pr-12"
                autocomplete="current-password" required>
              <button type="button" data-password-toggle="password" aria-label="Mostrar senha"
                class="absolute inset-y-0 right-0 flex w-11 items-center justify-center text-slate-400 hover:text-slate-700">
                <span data-icon="show" class="icon-[lucide--eye] size-4" aria-hidden="true"></span>
                <span data-icon="hide" class="icon-[lucide--eye-off] hidden size-4" aria-hidden="true"></span>
              </button>
            </div>
          </div>

          <label class="flex w-fit cursor-pointer items-center gap-2 text-sm text-slate-600 select-none">
            <input type="checkbox" name="remember" class="size-3.5 accent-primary">
            Lembrar-me
          </label>

          <button type="submit" class="btn-primary mt-2 w-full" data-submit>Entrar</button>
        </form>

        <div class="my-6 flex items-center gap-3 text-xs text-slate-400">
          <span class="h-px flex-1 bg-slate-200"></span>ou<span class="h-px flex-1 bg-slate-200"></span>
        </div>

        <!-- INTEGRAÇÃO: route('google.login') -->
        <a href="#" class="btn-outline w-full">
          <svg class="size-4" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
          </svg>
          Entrar com Google
        </a>

        <p class="mt-10 text-center text-sm text-slate-500">
          Primeiro acesso?
          <!-- INTEGRAÇÃO: route('forgot-password') -->
          <a href="forgot-password.html" class="link">Defina sua senha</a>
        </p>
      </div>
    </main>
  </div>

  <script src="assets/js/app.js" defer></script>
  <script src="assets/js/login.js" defer></script>
</body>
</html>
